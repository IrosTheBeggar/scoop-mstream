# Proves the manifest with a real scoop on a real Windows runner:
# install from this bucket, run the binary, uninstall cleanly.
name: scoop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install scoop
        shell: pwsh
        run: |
          irm get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install from this bucket's manifest
        shell: pwsh
        run: scoop install .\bucket\mstream-player.json

      - name: Runs on this hardware
        shell: pwsh
        run: mstream-player --version

      - name: Uninstall cleanly
        shell: pwsh
        run: scoop uninstall mstream-player
